# สำรองข้อมูล Supabase ทุกวัน → เก็บเป็นไฟล์เข้ารหัส (.json.gpg) ใน Actions artifacts 90 วัน
# + รูปในคลังความรู้ (Storage bucket "knowledge") เข้ารหัสเป็นไฟล์แยก job-schedule-images-*.tar.gpg
# + ตรวจขนาดฐานข้อมูล (500 MB) และ Storage (1 GB) ของแผน Free แจ้งเตือนผ่าน GitHub Issue (GitHub ส่งอีเมลให้เจ้าของ repo)
# ต้องตั้ง repository secrets: SUPABASE_SERVICE_ROLE_KEY, BACKUP_PASSPHRASE (ดู SETUP.md)
# ผลพลอยได้: มีการเรียกฐานข้อมูลทุกวัน project แผน Free จึงไม่ถูก pause
name: Daily Supabase backup

on:
  schedule:
    - cron: '0 18 * * *'   # 01:00 เวลาไทย
  workflow_dispatch:        # กด Run workflow เองได้จากแท็บ Actions

permissions:
  contents: read
  issues: write             # เปิด/ปิด issue แจ้งเตือน

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://raqwyoatasstnadwxkro.supabase.co
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      GH_TOKEN: ${{ github.token }}
      DB_LIMIT_MB: 500      # แผน Free
      DB_WARN_PCT: 80       # เตือนเมื่อใช้เกิน 80% (400 MB) — ใช้กับ Storage ด้วย
      STORAGE_LIMIT_MB: 1024  # แผน Free (รูปในคลังความรู้)
    steps:
      - name: Check secrets
        run: |
          [ -n "$SUPABASE_KEY" ] || { echo "::error::ยังไม่ได้ตั้ง secret SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          [ -n "$BACKUP_PASSPHRASE" ] || { echo "::error::ยังไม่ได้ตั้ง secret BACKUP_PASSPHRASE (repo เป็น public ห้ามเก็บ backup แบบไม่เข้ารหัส)"; exit 1; }

      - name: Export tables
        run: |
          set -euo pipefail
          mkdir -p pages
          fetch() {  # $1 = table, $2 = order
            local off=0 i=0 n
            while :; do
              curl -sS --fail-with-body "$SUPABASE_URL/rest/v1/$1?select=*&order=$2&offset=$off&limit=1000" \
                -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -o "pages/$1_$i.json" || return 1
              n=$(jq length "pages/$1_$i.json")
              i=$((i+1))
              [ "$n" -lt 1000 ] && break
              off=$((off+1000))
            done
            jq -s 'add' pages/$1_*.json > "$1.json"
          }
          fetch jobs created_at.asc
          fetch app_settings id.asc
          # คลังความรู้ (schema v4) — ถ้ายังไม่ได้สร้างตาราง ให้ backup ส่วนอื่นต่อไปได้
          if ! fetch knowledge created_at.asc; then
            echo "::warning::อ่านตาราง knowledge ไม่ได้ — รัน supabase/schema.sql (v4) ใน SQL Editor ก่อน"
            echo '[]' > knowledge.json
          fi
          # Resume ส่วนตัว (schema v5)
          if ! fetch resumes user_id.asc; then
            echo "::warning::อ่านตาราง resumes ไม่ได้ — รัน supabase/schema.sql (v5) ใน SQL Editor ก่อน"
            echo '[]' > resumes.json
          fi
          # ทะเบียน API (schema v7)
          if ! fetch apis created_at.asc; then
            echo "::warning::อ่านตาราง apis ไม่ได้ — รัน supabase/schema.sql (v7) ใน SQL Editor ก่อน"
            echo '[]' > apis.json
          fi
          STAMP=$(TZ=Asia/Bangkok date +%F)
          jq -n --slurpfile jobs jobs.json --slurpfile s app_settings.json --slurpfile notes knowledge.json --slurpfile resumes resumes.json --slurpfile apis apis.json --arg at "$(date -u +%FT%TZ)" \
            '{source:"github-actions", exported_at:$at, jobs:$jobs[0], settings:($s[0][0].data // {}), notes:$notes[0], resumes:$resumes[0], apis:$apis[0]}' > "job-schedule-backup-$STAMP.json"
          echo "jobs: $(jq length jobs.json) · notes: $(jq length knowledge.json)"
          # รูปที่เนื้อหาอ้างถึง ![…](kb:<path>) → images/<path>
          mkdir -p images
          { jq -r '.[].body' knowledge.json | grep -oE '\(kb:[A-Za-z0-9/._-]+\)' | sed -E 's/^\(kb:(.*)\)$/\1/' | sort -u > images.txt; } || true
          ok=0; miss=0
          while read -r p; do
            case "$p" in ''|*..*) continue;; esac
            mkdir -p "images/$(dirname "$p")"
            if curl -sS --fail -o "images/$p" "$SUPABASE_URL/storage/v1/object/knowledge/$p" \
                 -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY"; then ok=$((ok+1)); else miss=$((miss+1)); rm -f "images/$p"; fi
          done < images.txt
          echo "images: $ok (missing $miss)"
          [ "$miss" -eq 0 ] || echo "::warning::ดาวน์โหลดรูปไม่ได้ $miss ไฟล์ (อาจถูกลบไปแล้วแต่เนื้อหายังอ้างถึง)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - name: Encrypt
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "job-schedule-backup-$STAMP.json.gpg" "job-schedule-backup-$STAMP.json"
          if [ -n "$(ls -A images)" ]; then
            tar -cf images.tar -C images .
            gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
              --symmetric --cipher-algo AES256 -o "job-schedule-images-$STAMP.tar.gpg" images.tar
          fi
          rm -rf pages images images.tar images.txt jobs.json app_settings.json knowledge.json resumes.json apis.json "job-schedule-backup-$STAMP.json"

      - uses: actions/upload-artifact@v4
        with:
          name: job-schedule-backup-${{ env.STAMP }}
          path: |
            job-schedule-backup-*.json.gpg
            job-schedule-images-*.tar.gpg
          retention-days: 90
          if-no-files-found: error

      - name: Check database size
        id: health
        run: |
          if ! usage=$(curl -sS --fail-with-body -X POST "$SUPABASE_URL/rest/v1/rpc/db_usage" \
                -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}'); then
            echo "::warning::อ่านขนาดฐานข้อมูลไม่ได้ — รัน supabase/schema.sql (v3) ใน SQL Editor ก่อน"
            echo "pct=-1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          bytes=$(jq -r .db_bytes <<<"$usage"); jobs=$(jq -r .jobs <<<"$usage")
          mb=$(( bytes / 1048576 )); pct=$(( bytes * 100 / (DB_LIMIT_MB * 1048576) ))
          echo "### ฐานข้อมูล: ${mb} MB จาก ${DB_LIMIT_MB} MB (${pct}%) · ${jobs} งาน" >> "$GITHUB_STEP_SUMMARY"
          echo "DB ${mb} MB / ${DB_LIMIT_MB} MB (${pct}%), jobs=${jobs}"
          { echo "pct=$pct"; echo "mb=$mb"; echo "jobs=$jobs"; } >> "$GITHUB_OUTPUT"
          sbytes=$(jq -r '.storage_bytes // -1' <<<"$usage")
          if [ "$sbytes" -ge 0 ]; then
            smb=$(( sbytes / 1048576 )); spct=$(( sbytes * 100 / (STORAGE_LIMIT_MB * 1048576) )); files=$(jq -r '.files // 0' <<<"$usage")
            echo "### Storage (รูป): ${smb} MB จาก ${STORAGE_LIMIT_MB} MB (${spct}%) · ${files} ไฟล์" >> "$GITHUB_STEP_SUMMARY"
            { echo "spct=$spct"; echo "smb=$smb"; } >> "$GITHUB_OUTPUT"
          else
            echo "spct=-1" >> "$GITHUB_OUTPUT"
          fi

      # ---------- alerts (GitHub emails the repo owner when an issue is opened) ----------
      - name: Alert — database almost full
        if: steps.health.outputs.pct != '' && fromJSON(steps.health.outputs.pct) >= fromJSON(env.DB_WARN_PCT)
        run: |
          gh label create db-alert --color D93F0B --description "แจ้งเตือนฐานข้อมูลใกล้เต็ม" --force -R "$GITHUB_REPOSITORY"
          msg="ฐานข้อมูล Supabase ใช้ไป **${{ steps.health.outputs.mb }} MB จาก ${DB_LIMIT_MB} MB (${{ steps.health.outputs.pct }}%)** · ${{ steps.health.outputs.jobs }} งาน
          ถ้าเต็ม 500 MB แผน Free จะบันทึกข้อมูลไม่ได้ — ทางเลือก: Export งานเก่าเก็บเป็น Excel แล้วลบออก หรืออัปเกรด Supabase Pro
          รายละเอียด: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --label db-alert --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "$msg"
          else gh issue create -R "$GITHUB_REPOSITORY" --label db-alert --title "⚠️ ฐานข้อมูลใกล้เต็ม (${{ steps.health.outputs.pct }}%)" --body "$msg"; fi

      - name: Resolve — database size back to normal
        if: steps.health.outputs.pct != '' && fromJSON(steps.health.outputs.pct) >= 0 && fromJSON(steps.health.outputs.pct) < fromJSON(env.DB_WARN_PCT)
        run: |
          for n in $(gh issue list -R "$GITHUB_REPOSITORY" --label db-alert --state open --json number -q '.[].number'); do
            gh issue close "$n" -R "$GITHUB_REPOSITORY" --comment "กลับมาปกติ: ${{ steps.health.outputs.mb }} MB (${{ steps.health.outputs.pct }}%)"
          done

      - name: Alert — storage almost full
        if: steps.health.outputs.spct != '' && fromJSON(steps.health.outputs.spct) >= fromJSON(env.DB_WARN_PCT)
        run: |
          gh label create storage-alert --color D93F0B --description "แจ้งเตือนพื้นที่รูปใกล้เต็ม" --force -R "$GITHUB_REPOSITORY"
          msg="Supabase Storage (รูปในคลังความรู้) ใช้ไป **${{ steps.health.outputs.smb }} MB จาก ${STORAGE_LIMIT_MB} MB (${{ steps.health.outputs.spct }}%)**
          ถ้าเต็ม 1 GB จะแนบรูปใหม่ไม่ได้ — ทางเลือก: ลบเรื่องที่ไม่ใช้แล้ว (รูปถูกลบตาม) หรืออัปเกรด Supabase Pro
          รายละเอียด: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --label storage-alert --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "$msg"
          else gh issue create -R "$GITHUB_REPOSITORY" --label storage-alert --title "⚠️ พื้นที่รูปใกล้เต็ม (${{ steps.health.outputs.spct }}%)" --body "$msg"; fi

      - name: Resolve — storage back to normal
        if: steps.health.outputs.spct != '' && fromJSON(steps.health.outputs.spct) >= 0 && fromJSON(steps.health.outputs.spct) < fromJSON(env.DB_WARN_PCT)
        run: |
          for n in $(gh issue list -R "$GITHUB_REPOSITORY" --label storage-alert --state open --json number -q '.[].number' 2>/dev/null); do
            gh issue close "$n" -R "$GITHUB_REPOSITORY" --comment "กลับมาปกติ: ${{ steps.health.outputs.smb }} MB (${{ steps.health.outputs.spct }}%)"
          done

      - name: Alert — backup failed
        if: failure()
        run: |
          gh label create backup-failed --color B60205 --description "backup อัตโนมัติล้มเหลว" --force -R "$GITHUB_REPOSITORY"
          msg="Backup อัตโนมัติวันที่ $(TZ=Asia/Bangkok date '+%F %H:%M') **ล้มเหลว**
          สาเหตุที่พบบ่อย: Supabase ถูก pause (ไม่มีการใช้งาน 7 วัน) → เข้า Supabase Dashboard กด Restore · secret หมดอายุ/ผิด
          log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --label backup-failed --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "$msg"
          else gh issue create -R "$GITHUB_REPOSITORY" --label backup-failed --title "❌ Backup อัตโนมัติล้มเหลว" --body "$msg"; fi

      - name: Resolve — backup ok again
        if: success()
        run: |
          for n in $(gh issue list -R "$GITHUB_REPOSITORY" --label backup-failed --state open --json number -q '.[].number' 2>/dev/null); do
            gh issue close "$n" -R "$GITHUB_REPOSITORY" --comment "Backup กลับมาสำเร็จแล้ว: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done
